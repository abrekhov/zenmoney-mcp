name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Determine chart version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # tagged release: chart version = tag (v1.2.3 -> 1.2.3), appVersion follows
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/zenmoney-mcp/Chart.yaml
          else
            # main: unique semver prerelease per commit, e.g. 0.1.0-sha.abc1234
            BASE=$(awk '/^version:/ {print $2}' charts/zenmoney-mcp/Chart.yaml)
            VERSION="$BASE-sha.${GITHUB_SHA::7}"
          fi
          sed -i "s/^version:.*/version: $VERSION/" charts/zenmoney-mcp/Chart.yaml
          echo "CHART_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish chart to GHCR (OCI)
        run: |
          helm registry login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm package charts/zenmoney-mcp
          helm push zenmoney-mcp-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
