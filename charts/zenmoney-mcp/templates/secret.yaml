{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zenmoney-mcp.secretName" . }}
  labels:
    {{- include "zenmoney-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  ZENMONEY_TOKEN: {{ required "secrets.zenmoneyToken is required (or set secrets.existingSecret)" .Values.secrets.zenmoneyToken | quote }}
  {{- if .Values.config.baseURL }}
  MCP_OAUTH_PASSWORD: {{ required "secrets.oauthPassword is required when config.baseURL is set" .Values.secrets.oauthPassword | quote }}
  MCP_SIGNING_KEY: {{ required "secrets.signingKey is required when config.baseURL is set (openssl rand -hex 32)" .Values.secrets.signingKey | quote }}
  {{- end }}
{{- end }}
